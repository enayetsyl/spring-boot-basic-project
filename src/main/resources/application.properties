# app name (optional)
spring.application.name=runners

# Use a stable in-memory DB name
spring.datasource.generate-unique-name=false
spring.datasource.name=runners
# (or explicitly, pick ONE approach)
# spring.datasource.url=jdbc:h2:mem:runners;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Enable the H2 web console
spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Always run schema.sql (helps ensure table is created)
spring.sql.init.mode=always

# (optional) log script execution
# logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG


# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
